name: Backend tests

on:
  push:
    branches: [main, 'fix/**', 'agent/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q backend scripts training
      - name: Check frontend JavaScript syntax
        run: find frontend/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run full test suite
        run: python -m pytest -q
