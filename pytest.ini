[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    api: HTTP surface and response contracts
    upload: file staging and acceptance rules
    validation: field, URL and media validation
    security: attacks that must be refused
    inference: model behaviour on images
    video: frame sampling, aggregation and temporal signals
    parity: ONNX vs PyTorch, and model identity
    metrics: the evaluation arithmetic
    slow: needs the model and takes seconds, not milliseconds
