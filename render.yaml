# Render blueprint. `render.com/deploy` reads this; nothing here is secret.
#
# One worker, deliberately. Both inference engines are CPU-bound and the free
# tier gives 512 MB, so duplicating them in multiple workers is wasteful. One
# worker also keeps the in-process rate limiter/concurrency gate authoritative.
# Threads rather than workers let health/static requests proceed while the
# inference gate limits expensive analyses.
services:
  - type: web
    name: deepshield
    runtime: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt gunicorn "psycopg[binary]"
      && python scripts/fetch_origin_model.py
    startCommand: >
      gunicorn --pythonpath backend app:app
      --workers 1 --threads 4 --timeout 120
      --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: DS_HOST
        value: 0.0.0.0
      - key: DS_TRUST_PROXY
        value: "1"
      - key: DS_FORCE_HTTPS
        value: "1"
      - key: DS_RATE_LIMIT
        value: "20"
      - key: DS_LOG_JSON
        value: "1"
      # Keep the face detector's video pass bounded on the small free CPU.
      # The full-frame origin detector separately samples only a few frames.
      - key: DS_MAX_FRAMES
        value: "20"
      - key: DS_AI_ORIGIN_FRAMES
        value: "4"
      - key: DS_AI_ORIGIN_THREADS
        value: "1"
      # Conservative until a DeepShield-owned sealed benchmark is large
      # enough to calibrate this detector. Do not lower just to catch demos.
      - key: DS_AI_ORIGIN_THRESHOLD
        value: "0.85"
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DS_ANALYTICS
        value: "1"
